# Load order: lower runs first. Resources that reference others must run after them.
order: 100
mappings:
  - resource: AllergyIntolerance
    profile: http://hl7.org/fhir/us/core/StructureDefinition/us-core-allergyintolerance|6.1.0
    foreach: //act[templateId=2.16.840.1.113883.10.20.22.4.30]
    require: [code]
    fields:
      clinicalStatus.coding[0].system: =http://terminology.hl7.org/CodeSystem/allergyintolerance-clinical
      clinicalStatus.coding[0].code: statusCode@code | map:condStatus | default:active
      code: cc:entryRelationship/observation/participant/participantRole/playingEntity/code
      patient.reference: ref:Patient
      onsetDateTime: entryRelationship/observation/effectiveTime/low@value | date
      reaction[0].manifestation[0].concept: cc:entryRelationship/observation/entryRelationship/observation/value
