# Load order: lower runs first. Resources that reference others must run after them.
order: 60
mappings:
  - resource: Encounter
    profile: http://hl7.org/fhir/us/core/StructureDefinition/us-core-encounter|6.1.0
    foreach: //encounter[templateId=2.16.840.1.113883.10.20.22.4.49]
    fields:
      identifier[0].system: id@root | oid
      identifier[0].value: id@extension
      status: =completed
      class[0].coding[0].system: =http://terminology.hl7.org/CodeSystem/v3-ActCode
      class[0].coding[0].code: =AMB
      type[0]: cc:code
      subject.reference: ref:Patient
      actualPeriod.start: effectiveTime/low@value | date
      actualPeriod.end: effectiveTime/high@value | date
      location[0].location.reference: ref:Location
